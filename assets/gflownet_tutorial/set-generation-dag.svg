<svg viewBox="0 0 640 500" role="img" aria-labelledby="set-dag-title set-dag-desc" xmlns="http://www.w3.org/2000/svg">
<title id="set-dag-title">从空集逐个加入元素的 DAG</title>
<desc id="set-dag-desc">元素只有 0、1、2。每条边加入一个尚未出现的元素。两条高亮路径都从空集到达终态 {0,1,2}：一条经过 {0} 和 {0,1}，另一条经过 {2} 和 {0,2}。</desc>
<defs>
<marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6Z" fill="#8aa399"/></marker>
<marker id="arr-teal" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6Z" fill="#236c63"/></marker>
<marker id="arr-coral" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6Z" fill="#a8593d"/></marker>
</defs>
<g fill="none" stroke="#8aa399" stroke-width="1.6" marker-end="url(#arr-gray)">
<path d="M320,66 L320,147"/>
<path d="M120,189 L120,279"/><path d="M148,189 L294,279"/>
<path d="M292,189 L148,279"/><path d="M348,189 L492,279"/>
<path d="M492,189 L346,279"/><path d="M520,189 L520,279"/>
<path d="M148,321 L292,409"/><path d="M492,321 L348,409"/>
</g>
<g fill="none" stroke="#236c63" stroke-width="2.6" marker-end="url(#arr-teal)">
<path d="M292,66 L148,147"/><path d="M120,189 L120,279"/><path d="M148,321 L292,409"/>
</g>
<g fill="none" stroke="#a8593d" stroke-width="2.6" marker-end="url(#arr-coral)">
<path d="M348,66 L492,147"/><path d="M492,189 L346,279"/><path d="M320,321 L320,409"/>
</g>
<g fill="#f7f4ed" stroke="#d4ddd6" stroke-width="1.5">
<rect x="284" y="26" width="72" height="40" rx="12"/>
<rect x="74" y="147" width="92" height="42" rx="12"/>
<rect x="274" y="147" width="92" height="42" rx="12"/>
<rect x="474" y="147" width="92" height="42" rx="12"/>
<rect x="74" y="279" width="92" height="42" rx="12"/>
<rect x="274" y="279" width="92" height="42" rx="12"/>
<rect x="474" y="279" width="92" height="42" rx="12"/>
</g>
<rect x="262" y="409" width="116" height="46" rx="12" fill="#e7efe9" stroke="#77a89a" stroke-width="1.5"/>
<g text-anchor="middle" fill="#193e3b" font-family="system-ui,sans-serif" font-size="16" font-weight="650">
<text x="320" y="52">∅</text>
<text x="120" y="174">{0}</text>
<text x="320" y="174">{1}</text>
<text x="520" y="174">{2}</text>
<text x="120" y="306">{0,1}</text>
<text x="320" y="306">{0,2}</text>
<text x="520" y="306">{1,2}</text>
<text x="320" y="438">{0,1,2}</text>
</g>
</svg>
