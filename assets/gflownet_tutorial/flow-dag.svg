<svg viewBox="0 0 720 420" role="img" aria-labelledby="dag-title dag-desc" xmlns="http://www.w3.org/2000/svg">
<title id="dag-title">五节点守恒 flow 图</title>
<desc id="dag-desc">source s0 的流量是 8，分成 5 到 a 和 3 到 b。a 向 y 送 3，向 x 送 2。b 向 x 送 3。终态 y 接收 3，x 接收 5。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6Z" fill="#437b77"/></marker></defs>
<g stroke="#437b77" stroke-width="3" fill="none" marker-end="url(#arrow)">
<path d="M337,91 L229,155"/><path d="M383,91 L491,155"/>
<path d="M190,220 L161,304"/><path d="M235,213 L473,307"/><path d="M520,220 L520,301"/>
</g>
<g fill="#f7f4ed" stroke="#d4ddd6" stroke-width="1.5">
<rect x="295" y="24" width="130" height="72" rx="16"/>
<rect x="139" y="154" width="132" height="72" rx="16"/>
<rect x="454" y="154" width="132" height="72" rx="16"/>
</g>
<g fill="#e5f0ec" stroke="#77a89a" stroke-width="1.5">
<rect x="87" y="306" width="142" height="78" rx="16"/>
<rect x="449" y="306" width="142" height="78" rx="16"/>
</g>
<g text-anchor="middle" fill="#193e3b" font-family="system-ui, sans-serif">
<text x="360" y="54" font-size="24" font-weight="650">s₀</text><text x="360" y="78" font-size="14">F(s₀) = 8</text>
<text x="205" y="183" font-size="24" font-weight="650">a</text><text x="205" y="208" font-size="14">F(a) = 5</text>
<text x="520" y="183" font-size="24" font-weight="650">b</text><text x="520" y="208" font-size="14">F(b) = 3</text>
<text x="158" y="338" font-size="24" font-weight="650">y</text><text x="158" y="363" font-size="14">R(y) = 3</text>
<text x="520" y="338" font-size="24" font-weight="650">x</text><text x="520" y="363" font-size="14">R(x) = 5</text>
</g>
<g fill="#fff" stroke="#d4ddd6"><circle cx="277" cy="123" r="17"/><circle cx="444" cy="123" r="17"/><circle cx="177" cy="264" r="17"/><circle cx="352" cy="260" r="17"/><circle cx="520" cy="266" r="17"/></g>
<g text-anchor="middle" dominant-baseline="central" fill="#a85b40" font-family="system-ui,sans-serif" font-size="18" font-weight="700">
<text x="277" y="123">5</text><text x="444" y="123">3</text><text x="177" y="264">3</text><text x="352" y="260">2</text><text x="520" y="266">3</text>
</g></svg>
